<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude 홀덤 테이블</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">홀덤 테이블 <span>vs Claude</span></div>
      <div class="level" id="level">블라인드 <b>10/20</b></div>
      <div class="top-right">
        <div class="link" id="link"><i class="dot checking" id="link-dot"></i><span id="link-text">Claude 연결 확인 중</span><span class="link-short" id="link-short">확인 중</span></div>
        <div class="seg" id="depth" role="group" aria-label="Claude 생각 깊이" hidden>
          <button type="button" data-depth="quick" aria-pressed="true">빠르게</button>
          <button type="button" data-depth="default" aria-pressed="false">깊게</button>
        </div>
        <button class="link-btn" id="retry" type="button" hidden>다시 연결</button>
        <button class="link-btn" id="new-game" type="button">새 게임</button>
      </div>
    </header>

    <div class="layout">
      <section class="play">
        <div class="stage">
          <div class="table" id="table">
            <div class="felt" aria-hidden="true"></div>
            <!-- 가운데: 보드 · 팟 -->
            <div class="center">
              <div class="board" id="board"></div>
              <div class="pot" id="pot"></div>
              <div class="sidepots" id="sidepots"></div>
              <div class="print" id="print">No Limit</div>
            </div>
            <!-- 자리 · 베팅 칩: game.js가 인원에 맞춰 만든다 -->
            <div id="seats"></div>
          </div>
        </div>

        <div class="controls" id="controls"><div class="waiting">인원을 고르면 카드를 나눠줍니다</div></div>
      </section>

      <aside class="log-panel">
        <h2>핸드 기록</h2>
        <ol class="log" id="log"></ol>
      </aside>
    </div>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div></div>

  <script src="engine.js"></script>
  <script src="table.js"></script>
  <script src="gto.js"></script>
  <script src="game.js"></script>
</body>
</html>
